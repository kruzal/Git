<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vidhya — Priorities</title>
  <script>(function(){var t;try{t=localStorage.getItem('vidhya-theme')}catch(e){}document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')})()</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header"></header>
  <main id="page">
    <section class="hero reveal">
      <p class="eyebrow">Your priorities</p>
      <h1 id="title">What matters most right now?</h1>
      <p class="muted">Choose up to three, in order. Your chart is read for these first, and only the findings that carry real weight are shown, each one a single sentence with something you can do about it.</p>
    </section>

    <div class="card reveal">
      <div class="toolbar" style="justify-content:space-between;margin-bottom:14px">
        <h2 style="margin:0">Topics</h2>
        <span class="hint" id="status" aria-live="polite" style="margin:0"></span>
      </div>
      <div class="topic-grid" id="topics"></div>
    </div>

    <section id="results" style="margin-top:28px" aria-live="polite"></section>
  </main>

  <script src="/js/app.js"></script>
  <script>
    (async () => {
      const me = await Vidhya.init();
      if (!me) return;
      const e = Vidhya.escapeHtml;
      const statusEl = document.getElementById('status');
      let focus = await Vidhya.api('/api/focus');
      let chosen = [...focus.topics];
      let saveTimer = null;

      function renderTopics() {
        document.getElementById('topics').innerHTML = focus.available.map((t) => {
          const i = chosen.indexOf(t.key);
          return `<button type="button" class="topic-card" data-key="${t.key}" aria-pressed="${i >= 0}">
            ${i >= 0 ? `<span class="topic-rank">${i + 1}</span>` : ''}
            <strong>${e(t.name)}</strong><span class="blurb">${e(t.blurb)}</span></button>`;
        }).join('');
        document.querySelectorAll('.topic-card').forEach((b) => b.addEventListener('click', () => toggle(b.dataset.key)));
      }

      function toggle(key) {
        const i = chosen.indexOf(key);
        if (i >= 0) chosen.splice(i, 1);
        else if (chosen.length >= focus.max) {
          statusEl.textContent = `Three is the limit. A priority list only works if it is short, so remove one first.`;
          return;
        } else chosen.push(key);
        renderTopics();
        statusEl.textContent = 'Saving…';
        clearTimeout(saveTimer);
        saveTimer = setTimeout(save, 350);
      }

      async function save() {
        try {
          await Vidhya.api('/api/focus', { method: 'PUT', body: { topics: chosen } });
          statusEl.textContent = chosen.length ? 'Saved' : 'Cleared';
          await loadResults();
        } catch (err) { statusEl.textContent = err.message; }
      }

      async function loadResults() {
        const el = document.getElementById('results');
        const r = await Vidhya.api('/api/findings/me');
        if (!r.chosen.length) {
          el.innerHTML = `<div class="card card--quiet"><p class="eyebrow" style="margin-bottom:6px">Without a focus</p>
            <p class="soft" style="margin-top:0">Here is what carries the most weight in your chart overall. Choose topics above to have it read for what you actually care about.</p>
            ${r.top.map((f) => Vidhya.findingHtml(f)).join('') || '<p class="muted">Nothing clears the bar right now.</p>'}</div>`;
          return;
        }
        const doFirst = r.top.length ? `<div class="card reveal" style="margin-bottom:18px;border-color:color-mix(in srgb,var(--gold) 40%,var(--border))">
          <p class="eyebrow" style="margin-bottom:4px">Do these first</p>
          <p class="muted" style="margin-top:0">The three highest priorities across what you chose, preferring things you can act on.</p>
          ${r.top.map((f) => Vidhya.findingHtml(f, { why: false })).join('')}</div>` : '';
        const sections = r.sections.map((s) => `
          <div class="card reveal" style="margin-bottom:18px">
            <div class="section-head"><span class="rank">${s.rank}</span><h2 style="margin:0">${e(s.name)}</h2>
              <span class="hint" style="margin:0">${e(s.blurb)}</span></div>
            ${s.findings.length ? s.findings.map((f) => Vidhya.findingHtml(f)).join('')
              : '<p class="muted">Nothing in your chart carries real weight here right now. That is a finding too: no pressure, and no special lever, in this area.</p>'}
          </div>`).join('');
        el.innerHTML = doFirst + sections + `<p class="hint">Power is one score, 0 to 100, computed the same way for every sentence in the app. Your choices change the order and what is shown, never the score.
          ${r.meta.eligible} of ${r.meta.candidates} sentences cleared the minimum of ${r.meta.minPower}.</p>`;
      }

      renderTopics();
      await loadResults();
    })();
  </script>
</body>
</html>
