<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vidhya — My kundli</title>
  <script>(function(){var t;try{t=localStorage.getItem('vidhya-theme')}catch(e){}document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')})()</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header"></header>
  <main id="page" class="hidden">
    <section class="hero reveal">
      <p class="eyebrow">Your birth chart</p>
      <h1 id="title">…</h1>
      <p class="muted" id="born"></p>
    </section>

    <div class="kundli-hero" id="stats"></div>

    <div class="chart-layout">
      <div class="stack">
        <div class="card reveal">
          <div id="chart"></div>
          <div id="hovercard" class="hovercard"></div>
          <p class="hint" style="text-align:center;margin-top:10px">
            North Indian · houses fixed, numbers are signs · <strong>hover to preview, tap to open</strong>
          </p>
        </div>
        <div id="nwaran-note"></div>
      </div>
      <div class="stack">
        <div class="card reveal">
          <h2>The short version</h2>
          <div id="summary"></div>
        </div>
      </div>
    </div>

    <!-- ------------------------------------------------ explorer ---- -->
    <section style="margin-top:34px">
      <p class="eyebrow">Explore your chart</p>
      <div class="toolbar" style="justify-content:space-between;align-items:flex-end">
        <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end">
          <div>
            <label style="margin-bottom:5px">System</label>
            <div class="segmented" id="system" role="group" aria-label="Astrological system">
              <button type="button" data-value="vedic">Vedic</button>
              <button type="button" data-value="western">Western</button>
              <button type="button" data-value="numbers">Numbers</button>
            </div>
          </div>
          <div>
            <label style="margin-bottom:5px">Lens</label>
            <div class="segmented" id="lens" role="group" aria-label="What to explore"></div>
          </div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <div>
            <label style="margin-bottom:5px">Depth</label>
            <div class="segmented" id="depth" role="group" aria-label="Level of detail">
              <button type="button" data-value="brief">Brief</button>
              <button type="button" data-value="full">Full</button>
              <button type="button" data-value="technical">Technical</button>
            </div>
          </div>
          <div>
            <label style="margin-bottom:5px">Tone</label>
            <div class="segmented" id="tone" role="group" aria-label="Tone">
              <button type="button" data-value="gentle">Gentle</button>
              <button type="button" data-value="direct">Direct</button>
            </div>
          </div>
        </div>
      </div>

      <div class="explorer">
        <nav class="explorer-list" id="picker" aria-label="Select an item"></nav>
        <div class="card explorer-panel" id="panel" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/chart.js"></script>
  <script>
    (async () => {
      const me = await Vidhya.init();
      if (!me) return;
      const veil = Vidhya.skyVeil(['Reading your chart…', 'Weighing each placement…', 'Checking your dasha…']);

      const state = { system: 'vedic', lens: 'planets', depth: 'full', tone: 'direct', pick: null, house: null };
      let data, D, L;
      const e = Vidhya.escapeHtml;
      const deg = (d) => `${Math.floor(d)}°${String(Math.floor((d % 1) * 60)).padStart(2, '0')}′`;
      const ord = (n) => n + (['th','st','nd','rd'][(n % 100 - 20) % 10] || ['th','st','nd','rd'][n % 100] || 'th');
      const STATE_BAND = { flowing: 'strong', mixed: 'working', 'needs care': 'strained' };
      const stateBand = (st) => `<span class="band band--${STATE_BAND[st]}">${st}</span>`;
      const factorList = (list) => '<ul class="sig-list">' + list.map((f) => '<li>' + e(f.text) + '</li>').join('') + '</ul>';
      const BASIS = { karaka: 'classical karaka', 'natural-ruler': 'natural sign ruler', 'dig-bala': 'directional strength', unattested: 'no classical basis' };
      const sigRows = (n, active, outerNote) => {
        const S = L.significators, f = S.houses[n - 1], src = S.sources[0];
        const live = new Set(active.filter((a) => a.house === n).map((a) => a.planet));
        return '<h3>Significators</h3><ul class="fact-list">'
          + '<li><span>Classical karaka (Parashari)</span><strong>' + e(f.classical.join(', ')) + '</strong></li></ul>'
          + '<ul class="stack" style="list-style:none;padding:0;margin:8px 0">' + f.sourced.map((s) => '<li class="aspect-row' + (live.has(s.planet) ? ' is-protective' : '') + '">'
            + '<div class="ar-head"><strong>' + e(s.planet) + ' — ' + e(s.theme) + '</strong><span class="chip">' + e(BASIS[s.basis]) + '</span></div>'
            + '<p class="reading-text' + (s.tier === 'guarded' ? ' soft' : '') + '">' + e(s.text) + '</p>'
            + (live.has(s.planet) ? '<p class="hint">' + e(s.planet) + ' actually sits here in your chart, so this applies to you.</p>'
              : outerNote && ['Uranus', 'Neptune', 'Pluto'].includes(s.planet) ? '<p class="hint">' + outerNote + '</p>' : '')
            + '</li>').join('') + '</ul>'
          + (f.disagreement.missingClassical.length ? '<p class="hint">This source leaves out the classical karaka' + (f.disagreement.missingClassical.length > 1 ? 's ' : ' ')
            + e(f.disagreement.missingClassical.join(', ').replace(/, ([^,]*)$/, ' and $1')) + '. Both are kept; neither overrides the other.</p>' : '')
          + '<p class="hint">Source ' + e(src.id) + ': “' + e(src.title) + '”, ' + e(src.publisher) + ', ' + e(src.date) + '. Claims with no classical basis are shown in a softer tone and carry low weight.</p>';
      };
      const band = (b, s) => `<span class="band band--${b}">${b}${s !== undefined ? ` · ${s}/10` : ''}</span>`;

      async function load() {
        [data, L] = await Promise.all([
          Vidhya.api(`/api/kundli/me?tone=${state.tone}`),
          Vidhya.api('/api/lenses/me'),
        ]);
        D = data.detail;
      }
      await load();
      const c = data.chart;

      // ---------------------------------------------------------- header
      document.getElementById('title').textContent = data.profile.fullName;
      document.getElementById('born').textContent =
        `Born ${Vidhya.prettyDate(data.profile.birthDate)} at ${data.profile.birthTime} · ${data.place}`;
      document.getElementById('stats').innerHTML = [
        ['Lagna', c.ascendant.sign, `${deg(c.ascendant.degree)} · ruled by ${c.ascendant.lord}`],
        ['Rashi (Moon)', c.moonSign, 'the mind and how you feel'],
        ['Nakshatra', c.nakshatra.name, `pada ${c.nakshatra.pada} · lord ${c.nakshatra.lord}`],
        ['Running dasha', data.dasha.current ? data.dasha.current.lord : '—',
          data.dasha.current ? `until ${Vidhya.prettyDate(data.dasha.current.end)}` : ''],
      ].map(([l, v, s]) => `<div class="stat reveal"><span class="label">${l}</span><span class="value">${e(v)}</span><span class="sub">${e(s)}</span></div>`).join('');

      if (data.nwaranSuggestion) {
        document.getElementById('nwaran-note').innerHTML = `
          <div class="card card--quiet"><p style="margin:0" class="soft">${data.profile.nwaranName
            ? `Your nwaran name <strong>${e(data.profile.nwaranName)}</strong> is recorded. Tradition gives ${c.nakshatra.name} pada ${c.nakshatra.pada} the syllable <strong class="chip gold">${data.nwaranSuggestion}</strong>.`
            : `No nwaran name yet. Your Moon is in ${c.nakshatra.name} pada ${c.nakshatra.pada}, so tradition gives the syllable <strong class="chip gold">${data.nwaranSuggestion}</strong>. <a href="/onboarding?edit">Add it</a>`}</p></div>`;
      }

      function renderSummary() {
        const a = D.ascendant;
        const sorted = Object.values(D.strengths).sort((x, y) => y.score - x.score);
        const n = L.numerology;
        document.getElementById('summary').innerHTML = `
          <p class="reading-text" style="font-size:1.05rem">${e(a.text)}</p>
          <p class="reading-text">${e(a.lordText)}</p>
          <ul class="fact-list" style="margin:16px 0">
            <li><span>Strongest graha</span><strong>${sorted[0].planet} · ${sorted[0].score}/10</strong></li>
            <li><span>Most strained</span><strong>${sorted.at(-1).planet} · ${sorted.at(-1).score}/10</strong></li>
            <li><span>Driver / Conductor</span><strong>${n.driver.value} ${n.driver.planet} · ${n.conductor.value} ${n.conductor.planet}</strong></li>
            <li><span>Western big three</span><strong>${L.western.bigThree.sun} ☉ · ${L.western.bigThree.moon} ☾ · ${L.western.bigThree.rising} ↑</strong></li>
          </ul>
          ${D.yogas.filter((y) => y.id !== 'strongest').map((y) => `<p class="reading-text"><strong>${e(y.name)}.</strong> ${e(y.text)}</p>`).join('')}
          <p class="hint">Lahiri ayanamsa, whole-sign houses. <a href="/onboarding?edit">Birth details wrong?</a></p>`;
      }

      function renderChart() {
        document.getElementById('chart').innerHTML =
          VidhyaChart.northIndian(c, { selected: state.house, strengths: D.strengths });
        document.querySelectorAll('#chart .cell').forEach((cell) => {
          const go = () => {
            state.system = 'vedic'; state.lens = 'houses';
            state.pick = Number(cell.dataset.house); state.house = state.pick;
            renderLensBar(); renderPicker(); renderPanel(); renderChart(); sync();
          };
          cell.addEventListener('click', go);
          cell.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); go(); } });
          cell.addEventListener('mouseenter', () => renderHover(Number(cell.dataset.house)));
          cell.addEventListener('focus', () => renderHover(Number(cell.dataset.house)));
          cell.addEventListener('mouseleave', () => renderHover(null));
        });
      }

      // Compact preview while the pointer is over a house. Falls back to the
      // selected house so the card is never empty.
      function renderHover(house) {
        const box = document.getElementById('hovercard');
        const n = house ?? (state.lens === 'houses' ? Number(state.pick) : null);
        if (!n) { box.innerHTML = '<span class="hc-idle">Hover a house to preview it</span>'; return; }
        const h = D.houses.find((x) => x.house === n);
        const lordBit = h.lordStrength ? ' (' + e(h.lordStrength) + ')' : '';
        const occBit = h.occupants.length ? e(h.occupants.join(', ')) : 'empty';
        const aspBit = h.aspectedBy.length ? e(h.aspectedBy.map((a) => a.planet).join(', ')) : 'none';
        box.innerHTML = [
          '<div class="hc-head"><strong>' + ord(h.house) + ' · ' + e(h.sanskrit) + '</strong><span>' + e(h.sign) + '</span></div>',
          '<div class="hc-body">',
          '<span>' + e(h.name) + ' — ' + e(h.area) + '</span>',
          '<span><b>Lord</b> ' + e(h.lord) + ' in h' + h.lordHouse + lordBit + '</span>',
          '<span><b>Here</b> ' + occBit + ' · <b>Aspects</b> ' + aspBit + '</span>',
          '</div>',
          '<div class="hc-tags">' + h.tags.map((t) => '<span class="tag">' + e(t) + '</span>').join('') + '</div>',
        ].join('');
      }

      // ---------------------------------------------- lenses per system
      const LENSES = {
        vedic: [['planets', 'Grahas'], ['houses', 'Bhavas'], ['relations', 'Relations'], ['janma', 'Birth chain'], ['areas', 'Life areas'],
          ['karakas', 'Karakas'], ['patterns', 'Patterns'], ['image', 'Public image'],
          ['remedies', 'Remedies'], ['devata', 'Devata'], ['timing', 'Timing']],
        western: [['big3', 'Big three'], ['wplacements', 'Placements'], ['whouses', 'Houses'], ['waspects', 'Aspects'], ['balance', 'Balance']],
        numbers: [['core', 'Driver, Conductor & Life path'], ['name', 'Name number'], ['loshu', 'Lo Shu grid']],
      };

      function renderLensBar() {
        document.getElementById('lens').innerHTML = LENSES[state.system]
          .map(([v, label]) => `<button type="button" data-value="${v}">${label}</button>`).join('');
        if (!LENSES[state.system].some(([v]) => v === state.lens)) state.lens = LENSES[state.system][0][0];
        document.querySelectorAll('#lens button').forEach((b) => b.addEventListener('click', () => {
          state.lens = b.dataset.value; state.pick = null; sync(); renderPicker(); renderPanel();
        }));
      }

      const LISTS = {
        planets: () => D.placements.map((p) => ({ id: p.planet, label: p.planet,
          meta: `${p.sign} · h${p.house}`, badge: D.strengths[p.planet].band })),
        houses: () => D.houses.map((h) => ({ id: h.house, label: `${ord(h.house)} — ${h.name}`,
          meta: `${h.sign}${h.occupants.length ? ' · ' + h.occupants.join(', ') : ' · empty'}` })),
        relations: () => {
          const R = L.relations;
          return [
            { id: 'good', label: 'What is already good', meta: `${R.alreadyGood.length} houses flowing` },
            { id: 'karma', label: 'Where your karma flows', meta: `10th lord in h${R.karma.lordHouse}`, badge: STATE_BAND[R.karma.state] },
            ...R.axes.map((a) => ({ id: 'a:' + a.id, label: a.name, meta: `${ord(a.pair[0])} ↔ ${ord(a.pair[1])}` })),
            ...R.exchanges.map((x) => ({ id: x.id, label: `${x.planets.join(' ⇄ ')}`, meta: `${x.kind} parivartana` })),
            ...R.yogas.map((y) => ({ id: y.id, label: y.name, meta: `${y.planets.join(' + ')} · ${y.link}` })),
          ];
        },
        janma: () => [{ id: 'chain', label: 'The chain', meta: 'karma → ghadi' },
          ...L.janma.levels.map((lv, i) => ({ id: lv.id, label: `${i + 1}. ${lv.name}`, meta: lv.sanskrit }))],
        areas: () => L.lifeAreas.map((a) => ({ id: a.key, label: a.name,
          meta: `houses ${a.houses.join(', ')}`, badge: a.strongest?.band })),
        karakas: () => L.karakas.map((k) => ({ id: k.key, label: k.name, meta: `${k.planet} · h${k.house}` })),
        patterns: () => [...D.yogas.map((y) => ({ id: 'y:' + y.id, label: y.name, meta: 'yoga' })),
          ...D.conjunctions.map((cj, i) => ({ id: 'c:' + i, label: cj.name || cj.pair.join(' + '), meta: `house ${cj.house}` }))],
        image: () => [{ id: 'al', label: 'Arudha Lagna', meta: `house ${L.arudha.house} · ${L.arudha.sign}` },
          ...L.arudha.readings.map((r) => ({ id: 'p:' + r.planet, label: r.planet, meta: 'shapes the image' }))],
        remedies: () => L.remedies.map((r) => ({ id: r.planet, label: r.planet,
          meta: `${r.day} · ${r.priority} priority`, badge: r.band })),
        devata: () => [{ id: 'chain', label: 'The chain', meta: 'Ishvara to you' },
          ...L.devata.all.map((d) => ({ id: d.graha, label: d.graha, meta: `${d.popular} · ${d.day}`, badge: d.band }))],
        timing: () => [{ id: 'now', label: 'Where you are now', meta: 'dasha' },
          { id: 'balance', label: 'Dasha at birth', meta: 'starting point' },
          { id: 'maturity', label: 'Planet maturity', meta: 'fixed ages' }],
        big3: () => [{ id: 'sun', label: 'Sun sign', meta: L.western.bigThree.sun },
          { id: 'moon', label: 'Moon sign', meta: L.western.bigThree.moon },
          { id: 'rising', label: 'Rising sign', meta: L.western.bigThree.rising }],
        wplacements: () => L.western.placements.map((p) => ({ id: p.planet, label: p.planet,
          meta: `${p.sign} · ${p.element}` })),
        whouses: () => L.western.houses.map((h) => ({ id: h.n, label: `${ord(h.n)} — ${h.name}`,
          meta: `${h.cuspSign}${h.occupants.length ? ' · ' + h.occupants.join(', ') : ' · empty'}` })),
        waspects: () => L.western.aspects.map((a, i) => ({ id: String(i), label: a.pair.join(' — '),
          meta: `${a.name}${a.major ? '' : ' · minor'} · ${a.exactness}%`,
          badge: a.harmony === 'harmonious' ? 'strong' : a.harmony === 'challenging' ? 'weak' : 'working' })),
        balance: () => [{ id: 'el', label: 'Elements', meta: Object.keys(L.western.balance.element).join(', ') },
          { id: 'mo', label: 'Modalities', meta: Object.keys(L.western.balance.modality).join(', ') },
          { id: 'pol', label: 'Polarity', meta: L.western.balance.polarityDominant },
          { id: 'ruler', label: 'Chart ruler', meta: L.western.chartRuler.traditional },
          { id: 'love', label: 'Love language', meta: L.western.loveLanguage.element }],
        core: () => [{ id: 'driver', label: 'Driver (Mulank)', meta: `${L.numerology.driver.value} · ${L.numerology.driver.planet}` },
          { id: 'conductor', label: 'Conductor (Bhagyank)', meta: `${L.numerology.conductor.value} · ${L.numerology.conductor.planet}` },
          { id: 'lifePath', label: 'Life path', meta: `${L.numerology.lifePath.value}${L.numerology.lifePath.master ? ' master' : ''} · ${L.numerology.lifePath.planet}` }],
        name: () => [{ id: 'chaldean', label: 'Chaldean', meta: `value ${L.numerology.name.chaldean.value}` },
          { id: 'pythagorean', label: 'Pythagorean', meta: `value ${L.numerology.name.pythagorean.value}` }],
        loshu: () => [{ id: 'grid', label: 'Your grid', meta: '3×3 magic square' }],
      };

      function renderPicker() {
        const items = (LISTS[state.lens] || (() => []))();
        if (state.pick === null || !items.some((i) => String(i.id) === String(state.pick))) state.pick = items[0]?.id ?? null;
        document.getElementById('picker').innerHTML = items.map((i) => `
          <button type="button" class="explorer-item ${String(i.id) === String(state.pick) ? 'is-active' : ''}" data-id="${i.id}">
            <span class="ei-label">${e(i.label)}</span><span class="ei-meta">${e(i.meta)}</span>
            ${i.badge ? `<span class="band band--${i.badge}">${i.badge}</span>` : ''}
          </button>`).join('');
        document.querySelectorAll('.explorer-item').forEach((b) => b.addEventListener('click', () => {
          state.pick = b.dataset.id;
          if (state.lens === 'houses') { state.house = Number(b.dataset.id); renderChart(); renderHover(null); }
          renderPicker(); renderPanel();
        }));
      }

      const strengthRows = (s) => `<div class="table-wrap"><table><tbody>
        <tr><td>Sign dignity</td><td>${e(s.dignity.label)}</td><td class="num">${s.dignity.score}</td></tr>
        <tr><td>Natural house</td><td>${e(s.natural.label || 'neutral')}</td><td class="num">${s.natural.score}</td></tr>
        <tr><td>Avastha (by degree)</td><td>${e(s.avastha.name)}</td><td class="num">${s.avastha.score}</td></tr>
        <tr><td>Combustion</td><td>${s.combustion.combust ? `burnt, ${s.combustion.gap.toFixed(1)}° from the Sun` : 'clear of the Sun'}</td><td class="num">${s.combustion.score}</td></tr>
        <tr><td>Motion</td><td>${s.motion.retrograde ? 'retrograde' : 'direct'}</td><td class="num">${s.motion.score}</td></tr>
        <tr><td>Dispositor — ${e(s.dispositor.name)}</td><td>${e(s.dispositor.note || '—')}</td><td class="num">${s.dispositor.score}</td></tr>
      </tbody></table></div>`;

      function renderPanel() {
        const panel = document.getElementById('panel');
        const brief = state.depth === 'brief', tech = state.depth === 'technical';
        const P = state.pick;
        let html = '<p class="muted">Nothing selected.</p>';

        if (state.lens === 'planets') {
          const p = D.placements.find((x) => x.planet === P); const s = D.strengths[p.planet];
          html = `<div class="panel-head"><h2>${e(p.planet)}</h2>${band(s.band, s.score)}</div>
            <p class="muted">${e(p.sign)} ${deg(p.degree)} · house ${p.house} · ${e(p.nakshatra.name)} pada ${p.nakshatra.pada}</p>
            <p class="reading-text" style="font-size:1.03rem">${e(p.text)}</p>
            ${brief ? '' : `<h3>What it reaches</h3><ul class="fact-list">${p.aspects.map((a) =>
              `<li><span>${ord(a.count)} aspect</span><strong>house ${a.house} — ${e(a.area)}</strong></li>`).join('')}</ul>
              ${D.conjunctions.filter((cj) => cj.pair.includes(p.planet)).map((cj) =>
                `<h3>With ${e(cj.pair.find((x) => x !== p.planet))}</h3><p class="reading-text">${e(cj.text)}</p>`).join('')}`}
            ${tech ? `<h3>How the strength is scored</h3>${strengthRows(s)}` : ''}`;
        }

        if (state.lens === 'houses') {
          const h = D.houses.find((x) => x.house === Number(P));
          const occ = D.placements.filter((p) => p.house === h.house);
          const parts = [];

          parts.push('<div class="panel-head"><h2>' + ord(h.house) + ' — ' + e(h.sanskrit) + ' · ' + e(h.name)
            + '</h2><span class="chip">' + e(h.sign) + '</span></div>');
          parts.push('<div class="hc-tags" style="margin-bottom:12px">'
            + h.tags.map((t) => '<span class="tag">' + e(t) + '</span>').join('') + '</div>');
          parts.push('<p class="muted">' + e(h.area) + '</p>');
          parts.push('<p class="reading-text">' + e(h.chain) + '</p>');
          const v = L.relations.houses[h.house - 1];
          parts.push('<h3>How it is doing ' + stateBand(v.state) + '</h3>');
          if (v.supports.length) parts.push('<p class="eyebrow" style="margin:8px 0 2px">Already working for you</p>' + factorList(v.supports));
          if (v.cautions.length) parts.push('<p class="eyebrow" style="margin:8px 0 2px">Needs care</p>' + factorList(v.cautions));
          if (v.sustainedBy.house !== h.house) {
            parts.push('<p class="hint">Held up by your ' + ord(v.sustainedBy.house) + ' (' + e(v.sustainedBy.name.toLowerCase())
              + '), the ' + ord(h.house) + ' from the ' + ord(h.house) + '. That house is ' + e(v.sustainedBy.state) + ', so '
              + (v.sustainedBy.state === 'needs care' ? 'shoring it up helps this one too.' : 'it gives this one something to stand on.') + '</p>');
          }

          parts.push('<h3>What this house covers</h3><ul class="sig-list">'
            + h.significations.map((x) => '<li>' + e(x) + '</li>').join('') + '</ul>');

          if (occ.length) {
            parts.push('<h3>Grahas sitting here</h3>');
            occ.forEach((pl) => parts.push('<p class="reading-text"><strong>' + e(pl.planet) + '.</strong> ' + e(pl.text) + '</p>'));
          } else {

                <span class="ct">${cell.count ? '•'.repeat(cell.count) : '—'}</span>
              </div>`).join('')}</div>
            ${g.repeated.length ? `<p class="reading-text"><strong>Repeated:</strong> ${g.repeated.map((r) => `${r.n} appears ${r.count}×`).join(', ')}.</p>` : ''}
            ${g.missing.length ? `<p class="reading-text"><strong>Missing:</strong> ${g.missing.join(', ')}.</p>` : ''}`;
        }

        panel.innerHTML = html;
      }

      function sync() {
        [['system', state.system], ['lens', state.lens], ['depth', state.depth], ['tone', state.tone]].forEach(([id, val]) =>
          document.querySelectorAll(`#${id} button`).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.value === val))));
      }
      Vidhya.bindSegmented(document.getElementById('system'), state.system, (v) => {
        state.system = v; state.pick = null; renderLensBar(); sync(); renderPicker(); renderPanel();
      });
      Vidhya.bindSegmented(document.getElementById('depth'), state.depth, (v) => { state.depth = v; renderPanel(); });
      Vidhya.bindSegmented(document.getElementById('tone'), state.tone, async (v) => {
        state.tone = v; await load(); renderSummary(); renderPicker(); renderPanel(); renderChart();
      });

      renderSummary(); renderChart(); renderLensBar(); renderPicker(); renderPanel(); sync(); renderHover(null);
      document.getElementById('page').classList.remove('hidden');
      await veil.done(1400);
    })();
  </script>
</body>
</html>
